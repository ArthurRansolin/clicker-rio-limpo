  </linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#72C9C7"/><stop offset=".5" stop-color="#3599A7"/><stop offset="1" stop-color="#24758D"/>
  </linearGradient>
</defs>
<rect width="1920" height="1080" fill="url(#sky)"/>
