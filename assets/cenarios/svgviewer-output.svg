<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8198A5"/>
    <stop offset="1" stop-color="#C7D1D5"/>
  </linearGradient>

  <!-- Gradiente sutil para dar profundidade à água -->
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#426F67"/>
    <stop offset="1" stop-color="#315E59"/>
  </linearGradient>
</defs>

<!-- CÉU -->
<rect width="1920" height="1080" fill="url(#sky)"/>

<!-- ÁREA INDUSTRIAL -->
<rect x="0" y="520" width="1920" height="240" fill="#82939B"/>

<g stroke="#38464D" stroke-width="8">
  <rect x="170" y="300" width="260" height="420" fill="#697982"/>
  <rect x="480" y="390" width="310" height="330" fill="#73848D"/>
  <rect x="1310" y="350" width="350" height="370" fill="#657780"/>

  <path d="M230 300V180h80v120
           M580 390V210h90v180
           M1460 350V160h95v190"
        fill="#596970"/>
</g>

<!-- FUMAÇA -->
<g fill="#AAB5BA" opacity=".8">
  <circle cx="270" cy="130" r="55"/>
  <circle cx="330" cy="90" r="75"/>
  <circle cx="625" cy="160" r="65"/>
  <circle cx="1510" cy="115" r="80"/>
  <circle cx="1600" cy="80" r="60"/>
</g>

<!-- MARGEM / PARTE SUPERIOR DO RIO -->
<path d="M0 720 Q360 650 720 720 T1440 700 T1920 720 V1080 H0Z"
      fill="url(#water)"
      stroke="#173D43"
      stroke-width="8"/>

<!-- SEGUNDA CAMADA DA ÁGUA -->
<path d="M0 760 Q350 700 720 760 T1450 740 T1920 760 V1080 H0Z"
      fill="#426F67"/>

<!-- ÁREA MAIS ESCURA DA CORRENTE -->
<path d="M0 850 Q400 800 800 860 T1600 840 T1920 850"
      fill="none"
      stroke="#526E58"
      stroke-width="150"/>


